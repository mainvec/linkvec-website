<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Linkvec direct tunnel logo concept</title>
  <desc id="desc">Two endpoints connected by a direct path with a curved fallback tunnel path.</desc>
  <style>
    .ink { stroke: #1a1a2e; }
    .fill-ink { fill: #1a1a2e; }
    .accent { stroke: #4a6cf7; }
    .fill-accent { fill: #4a6cf7; }
    @media (prefers-color-scheme: dark) {
      .ink { stroke: #ffffff; }
      .fill-ink { fill: #ffffff; }
    }
  </style>

  <!-- Tunnel / fallback path -->
  <path
    class="ink"
    d="M8.75 21.25C11.25 26.25 20.75 26.25 23.25 21.25"
    stroke-width="2.25"
    stroke-linecap="round"
    opacity="0.45"
  />

  <!-- Direct peer-to-peer path -->
  <path class="accent" d="M8.25 16H23.75" stroke-width="2.5" stroke-linecap="round" />

  <!-- Broker / tunnel boundary -->
  <circle class="ink" cx="16" cy="16" r="4.75" fill="#f7f5ef" stroke-width="2.25" />
  <circle class="fill-accent" cx="16" cy="16" r="1.55" />

  <!-- Endpoints -->
  <circle class="fill-ink" cx="7" cy="16" r="3" />
  <circle class="fill-ink" cx="25" cy="16" r="3" />
</svg>
