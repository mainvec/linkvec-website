site:
  name: Linkvec
  site: 'https://linkvec.com'
  base: '/'
  trailingSlash: false

  googleSiteVerificationId: ''

# Default SEO metadata
metadata:
  title:
    default: Linkvec — Connect on your terms
    template: '%s — Linkvec'
  description: 'Linkvec is a connectivity platform that lets you expose ports, share services, and build mesh VPNs through any NAT — with your broker or ours.'
  robots:
    index: true
    follow: true
  openGraph:
    site_name: Linkvec
    images:
      - url: '~/assets/images/default.png'
        width: 1200
        height: 628
    type: website
  twitter:
    handle: '@linkvec'
    site: '@linkvec'
    cardType: summary_large_image

i18n:
  language: en
  textDirection: ltr

apps:
  blog:
    isEnabled: true
    postsPerPage: 6

    post:
      isEnabled: true
      permalink: '/%slug%' # Variables: %slug%, %year%, %month%, %day%, %hour%, %minute%, %second%, %category%
      robots:
        index: true

    list:
      isEnabled: true
      pathname: 'blog' # Blog main path, you can change this to "articles" (/articles)
      robots:
        index: true

    category:
      isEnabled: true
      pathname: 'category' # Category main path /category/some-category, you can change this to "group" (/group/some-category)
      robots:
        index: true

    tag:
      isEnabled: true
      pathname: 'tag' # Tag main path /tag/some-tag, you can change this to "topics" (/topics/some-category)
      robots:
        index: false

    isRelatedPostsEnabled: true
    relatedPostsCount: 4

analytics:
  vendors:
    googleAnalytics:
      id: null # or "G-XXXXXXXXXX"

ui:
  theme: 'system' # Values: "system" | "light" | "dark" | "light:only" | "dark:only"

announcement:
  isEnabled: true
  label: Alpha
  text: Linkvec is in early alpha — expect rough edges. We'd love your feedback.
  href: https://github.com/linkvec/linkvec/discussions
  isTargetBlank: true
